<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 420px; padding: 40px 20px; text-align: center; }
        .logo-circle {
            width: 56px; height: 56px; border-radius: 50%;
            background: conic-gradient(from 90deg, #ffffff, #333333, #ffffff);
            margin: 0 auto 24px auto;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #a0a0a0; margin-bottom: 32px; line-height: 1.5; }
        form p { margin-bottom: 16px; text-align: left; }
        form label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 6px; }
        form input {
            width: 100%; padding: 14px 16px; border-radius: 999px;
            border: 1px solid #2a2a2a; background-color: #161616;
            color: #ffffff; font-size: 15px; outline: none;
        }
        form input:focus { border-color: #6366f1; }
        .submit-btn {
            width: 100%; padding: 14px 16px; border-radius: 999px; border: none;
            background-color: #6366f1; color: #ffffff; font-size: 15px;
            font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .submit-btn:hover { background-color: #5457e0; }
        .back-link { font-size: 14px; color: #a0a0a0; margin-top: 24px; }
        .back-link a { color: #ffffff; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-circle"></div>
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            <p>
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" required>
            </p>
            <button type="submit" class="submit-btn">Send Reset Link</button>
        </form>
        <p class="back-link">Remembered it? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</body>
</html>
