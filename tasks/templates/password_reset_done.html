<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Your Email - Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 420px; padding: 40px 20px; text-align: center; }
        .logo-circle {
            width: 56px; height: 56px; border-radius: 50%;
            background: conic-gradient(from 90deg, #ffffff, #333333, #ffffff);
            margin: 0 auto 24px auto;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 14px; color: #a0a0a0; line-height: 1.6; margin-bottom: 24px; }
        .back-link a {
            display: inline-block; text-decoration: none; border: 1px solid #333333;
            color: #ffffff; padding: 12px 24px; border-radius: 999px;
            font-weight: 600; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-circle"></div>
        <h1>Check your email</h1>
        <p>We've sent a password reset link to the email address you provided, if an account exists with it. Check your inbox (and spam folder) for further instructions.</p>
        <div class="back-link"><a href="{% url 'login' %}">Back to Log in</a></div>
    </div>
</body>
</html>
