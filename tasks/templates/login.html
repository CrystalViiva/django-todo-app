<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Log In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
        }

        .logo-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: conic-gradient(from 90deg, #ffffff, #333333, #ffffff);
            margin: 0 auto 24px auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #a0a0a0;
            margin-bottom: 32px;
        }

        form p {
            margin-bottom: 16px;
            text-align: left;
        }

        form label {
            display: block;
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 6px;
        }

        form input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 999px;
            border: 1px solid #2a2a2a;
            background-color: #161616;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        form input:focus {
            border-color: #6366f1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            border-radius: 999px;
            border: none;
            background-color: #6366f1;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background-color: #5457e0;
        }

        .error-message {
            background-color: #2a1414;
            border: 1px solid #f87171;
            color: #f87171;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .register-link {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 24px;
        }

        .register-link a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-circle"></div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your Task Manager account</p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <p>
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required>
            </p>
            <p style="position: relative;">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>
                <span onclick="togglePassword('id_password', this)" style="position: absolute; right: 14px; top: 38px; cursor: pointer; font-size: 13px; color: #a0a0a0; user-select: none;">Show</span>
            </p>
            <p style="text-align: right; margin-top: -10px;">
                <a href="{% url 'password_reset' %}" style="color:#a0a0a0; font-size:13px; text-decoration:none;">Forgot password?</a>
            </p>
            <button type="submit" class="submit-btn">Log in</button>
        </form>

        <p class="register-link">
            Don't have an account? <a href="{% url 'register' %}">Sign up</a>
        </p>
    </div>

<script>
        function togglePassword(fieldId, toggleEl) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                toggleEl.textContent = 'Hide';
            } else {
                field.type = 'password';
                toggleEl.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
