<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete - Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 420px; padding: 40px 20px; text-align: center; }
        .logo-circle {
            width: 56px; height: 56px; border-radius: 50%;
            background: conic-gradient(from 90deg, #4ade80, #16a34a, #4ade80);
            margin: 0 auto 24px auto;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 14px; color: #a0a0a0; margin-bottom: 24px; }
        .login-btn {
            display: inline-block; text-decoration: none; background-color: #6366f1;
            color: #ffffff; padding: 12px 28px; border-radius: 999px;
            font-weight: 600; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-circle"></div>
        <h1>Password reset complete</h1>
        <p>Your password has been changed successfully. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="login-btn">Go to Log in</a>
    </div>
</body>
</html>
